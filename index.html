<style>/* Leaflet 1.9.4 */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;

	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;

	}

	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;

	}
.leaflet-touch .leaflet-bar a:first-child {

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

	}


/* layers control */

.leaflet-control-layers {

.leaflet-touch .leaflet-control-layers-toggle {

	}
.leaflet-control-layers .leaflet-control-layers-list,

/* Default icon URLs */

	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;

.leaflet-control-attribution,

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {
	position: absolute;

	}
.leaflet-popup-content-wrapper {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

	}
.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

<style>
:root{
  --bg:#FBF7EE; --ink:#3A2E2A; --muted:#6B6560; --line:#E6DFD0;
  --g:#0C8F3B; --gt:#E7F7EC; --red:#E05A4B; --gold:#F2B93E; --card:#fff;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink)}

#map{position:absolute;inset:0}
.leaflet-container{background:#EDE7D9;font-family:var(--font)}
/* 把 OSM 的冷灰底圖調成暖色，跟宮廟 pin 同一個色調 */
/* 底圖調暖，跟宮廟 pin 同色調。太黃就把 sepia 調小，太冷就調大（0 ~ .35） */
.leaflet-tile-pane{filter:sepia(.10) saturate(.95) brightness(1.02)}

/* ---- 頂部篩選 ---- */
.top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px 8px;
     background:linear-gradient(to bottom,rgba(251,247,238,.97) 70%,rgba(251,247,238,0));
     padding-top:calc(10px + env(safe-area-inset-top))}
.title{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.title svg{width:20px;height:20px}
/* 七個心願改回一行左右滑。右邊留一道漸層淡出，暗示後面還有；
   滑到底時 JS 會把漸層關掉，才不會一直假裝有東西沒看完。 */
.chipwrap{position:relative}
.chipwrap::after{content:"";position:absolute;top:0;bottom:0;right:0;width:34px;
  background:linear-gradient(to right, rgba(251,247,238,0), var(--bg,#FBF7EE) 78%);
  pointer-events:none;opacity:1;transition:opacity .2s}
.chipwrap.end::after{opacity:0}
.chips{display:flex;flex-wrap:nowrap;gap:7px;padding-bottom:2px;
       overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
       scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;
      padding:6px 13px 6px 7px;font-size:13px;font-weight:700;color:var(--muted);
      white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
      font-family:var(--font);transition:background .16s,border-color .16s,color .16s}
.chip.plain{padding:6px 15px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
/* 法器小圖：跟清單縮圖是同一張，使用者按下心願後看到清單也是同一個圖 */
.cimg{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none;
      background:#FAF5E6}
.chip.on .cimg{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

/* ---- 我的位置 ---- */
.me{width:16px;height:16px;border-radius:50%;background:#2563EB;
    border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.18)}

/* ---- 宮廟標記 ---- */
/* 標記就是圖片本身：沒有白圈、沒有尖角，錨點在正中央 */
.pin{width:44px;height:44px;transform:translate(-50%,-50%);
     transform-origin:50% 50%;position:relative;
     animation:drop .42s cubic-bezier(.34,1.56,.64,1) backwards}
/* 立體感：像桌遊棋子。底下一片地面陰影 + 磁磚厚邊 + 小廟本身再浮一層 */
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;width:34px;height:9px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(58,46,42,.38) 0%, rgba(58,46,42,0) 72%)}
@keyframes drop{
  0%{transform:translate(-50%,-130%) scale(.55);opacity:0}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pin.act{animation:pop .5s cubic-bezier(.34,1.56,.64,1);z-index:600}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-62%) scale(1.24)}
  100%{transform:translate(-50%,-50%) scale(1.16)}}
.pin.act{transform:translate(-50%,-50%) scale(1.16)}
/* 我的位置：呼吸光暈 */
.me{position:relative}
.me::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(37,99,235,.5);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
/* 圖釘：圓角白底上一座統一的小廟（大富翁風），底圖再花也看得出來是廟 */
.pdot{position:relative;width:44px;height:44px;border-radius:12px;overflow:hidden;
      background:linear-gradient(180deg,#FFFCF3 0%,#F4EBD5 100%);
      box-sizing:border-box;display:grid;place-items:center;
      /* 上緣一道亮邊、下面一塊 3px 厚邊（磁磚的側面）、再一層柔和投影 */
      box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(58,46,42,.10),
                 0 3px 0 #D6C9AD, 0 6px 10px rgba(58,46,42,.26)}
.pin.act .pdot{box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(58,46,42,.10),
                 0 5px 0 #D6C9AD, 0 11px 16px rgba(58,46,42,.30)}   /* 選到的那顆抬高一點 */
.pin.act::after{width:40px;height:11px;bottom:-11px;opacity:.9}
/* 停車場圖釘：只在點了一間廟之後出現，範圍跟獅仔講的「附近」一樣（500 公尺）。
   比宮廟小一號、沒有落下動畫的彈跳，才不會搶戲。 */
.pin.ppin{width:30px;height:30px;animation-duration:.3s}
.pin.ppin .pdot{width:30px;height:30px;border-radius:9px;
  box-shadow:inset 0 1px 0 #fff, 0 2px 0 #D6C9AD, 0 4px 7px rgba(58,46,42,.22)}
.pin.ppin .temple{width:26px;height:26px}
.pin.ppin::after{width:22px;height:6px;bottom:-5px}
.pdot .temple{width:40px;height:40px;display:block;object-fit:contain;
              transform:translateY(-1px);
              filter:drop-shadow(0 2px 1.5px rgba(58,46,42,.28))}   /* 小廟本身再浮出磁磚一點 */

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--card);
       border-radius:18px 18px 0 0;
       box-shadow:0 -3px 20px rgba(58,46,42,.16);

     position:relative}

.row::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:3px;
  background-image:radial-gradient(circle at 4px 3px, #EFE9DA 3px, transparent 3.5px);

.rthumb{position:relative;width:52px;height:52px;border-radius:15px;flex:none;

        background:linear-gradient(180deg,#FFFCF3 0%,#F4EBD5 100%);

     padding:1.5px 7px;font-size:11px;font-weight:800;margin-right:5px}
/* 清單編號改成小廟簷 */

/* 第三行：設施與開放時間。沒有資料就整行不出現，所以還沒調查的宮廟

.rfac{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:5px}
/* 設施四格：同一個色調。on = 有，off = 還不知道（淡色，不是灰掉的「沒有」） */
.fslot{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;
       border-radius:6px;background:#F3EEE3;border:1px solid #E3DBCA;
       color:#5C5340;font-size:10.5px;font-weight:800;line-height:1}
.fslot svg{width:13px;height:13px;fill:currentColor;display:block}
.fslot b{font-weight:800}
.fslot.off{color:#CFC7B8;background:#FBF8F1;border-color:#EFE9DC}
.fslot.js-todo{cursor:pointer}
.fopen{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.fopen i{width:6px;height:6px;border-radius:50%;flex:none}
.fopen.yes{color:#127A3E} .fopen.yes i{background:#17A34A}
.fopen.no{color:#9A938C}  .fopen.no i{background:#C6BFB6}
.fpeak{font-size:10.5px;color:#9A938C}
/* 附近設施用外框，跟「廟內設施」的實心藥丸在視覺上分開，
   不然使用者會以為廁所在廟裡面 */
.npill{font-size:10.5px;font-weight:700;color:#5A6E86;background:transparent;

.npill svg{width:11px;height:11px;flex:none}
.npill b{font-weight:800}
.npill.full{color:#B0603A;border-color:#E8CDBC}
.npill.ico{padding:2px 5px}
.npill.ico svg{width:13px;height:13px}
/* 第三種狀態：還沒有任何來源，等廟方自己補。
   看得清楚，但用問號和不同色系表明「這是待確認」而不是「已經有」——
   點下去會說明，這一格本身就是廟方回報功能的入口。 */
.npill.todo{border-color:#CDBFA4;background:#FBF7EC;color:#8A7C5E;cursor:pointer;

.npill.todo:active{background:#F3ECDC}
/* 人潮：用「填滿幾格」表示多寡，不用顏色分級。

   所以份量交給格數與文字，顏色只留一種。 */
.crowd{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;

.cmeter{display:inline-flex;align-items:flex-end;gap:2px;height:11px}
.cmeter i{width:3.5px;background:#E2DBCB;border-radius:1px;display:block}
.cmeter i:nth-child(1){height:5px}
.cmeter i:nth-child(2){height:8px}
.cmeter i:nth-child(3){height:11px}
.cmeter i.on{background:#8A6A3C}
.item{position:relative}
.rgo{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.rdist{font-size:12px;font-weight:800;color:var(--ink)}
/* 導航改成圓形圖示鈕。視覺 36px，但用 padding 把可點範圍撐到 44px，
   因為使用者偏年長，觸控目標不能小於 44。 */
.rbtn{background:transparent;border:none;padding:4px;margin:-4px;
      display:grid;place-items:center;cursor:pointer;line-height:0}
/* 導航鈕：白底、暖色邊框與箭頭同色（#A2926C），圓角 15px 跟左邊的宮廟縮圖同弧度。
   邊框與箭頭刻意用同一個顏色，整顆才會讀成「一組」而不是「空圈裡裝了東西」。
   #A2926C 對白底的對比是 3.06:1，剛好跨過圖形元件的 3:1 門檻——
   再淡一階（#BCAF8E 2.17:1）在戶外陽光下就看不見了。 */
.rbtn i{width:36px;height:36px;border-radius:15px;background:#fff;
        border:1.5px solid #A2926C;box-sizing:border-box;
        display:grid;place-items:center;transition:transform .12s,background .12s}
.rbtn:active i{transform:scale(.92);background:#F6F2E7}
.rbtn svg{width:17px;height:17px;fill:#A2926C;pointer-events:none}
.rbtn:focus-visible i{outline:2px solid var(--g);outline-offset:3px}
.empty{padding:22px 16px 30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.75;
       display:flex;flex-direction:column;align-items:center;gap:4px}
.emptyart{width:104px;height:80px;opacity:.92;margin-bottom:6px}
.empty b{font-size:14.5px;font-weight:800;color:var(--ink)}

/* ---- 定位按鈕 ---- */
/* 熊爸：地圖上的浮動提示。內容全部從「已經知道的事實」生成——
   使用者選的心願、最近的宮廟與距離、真實停車位、目前時段。

.bear{position:absolute;left:16px;right:64px;z-index:1000;
      bottom:calc(58% + 14px);transition:bottom .25s, opacity .3s, transform .3s;

.bear.hide{opacity:0;transform:translate(var(--dx,0px), calc(var(--dy,0px) + 6px));pointer-events:none}

.bearcall{position:absolute;left:14px;z-index:1000;bottom:calc(58% + 14px);

  box-shadow:0 3px 10px rgba(58,46,42,.28);padding:0;overflow:hidden;cursor:pointer;
  display:none;transition:bottom .25s, transform .12s}
.bearcall.on{display:block}

.bear .av{position:absolute;left:-10px;bottom:-3px;height:70px;width:auto;

          filter:drop-shadow(0 2px 3px rgba(58,46,42,.28))}
.bear .msg{font-size:12.5px;line-height:1.55;color:var(--ink);font-weight:500}
.bear .msg b{font-weight:800}
.bear .msg a.lnk{color:var(--g);font-weight:700;text-decoration:underline;
                 text-underline-offset:2px;white-space:nowrap}
.bear .msg .src{display:block;margin-top:3px;font-size:10.5px;color:#A29C8C;font-weight:600}

.bear .msg .sec{margin:2px 0;line-height:1.5}
/* 看故事的四段簡介：兩欄對齊（標籤一欄、內文一欄），眼睛沿左邊掃就能找到要的那段。
   「適合」是分類 → chip，跟上方篩選列同一種語言；「近期活動」有三層資訊 → 日曆小卡。
   小卡的日期方塊用米白底（#F6F4ED），不用紅——紅在介面上是警告，這裡只是日曆。 */

.bear .msg .bh{display:flex;align-items:center;gap:7px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #F0EBE0}

.bear .msg .brow{display:grid;grid-template-columns:52px 1fr;gap:6px;margin:5px 0;align-items:start}   /* 不叫 .row，清單列已經用掉了 */
.bear .msg .bk{font-size:10.5px;font-weight:800;color:#8C7A5A;letter-spacing:.06em;padding-top:2px}

.bear .msg .cal small{display:block;font-size:10px;color:#8C8778;font-weight:600}
.bear .msg .btns{display:flex;gap:6px;margin-top:8px}
.bear .msg .bbtn{flex:1;font:inherit;font-size:11.5px;font-weight:800;padding:6px 0;border-radius:8px;cursor:pointer;
                 border:1px solid #DDD3BF;background:#FBF9F4;color:#5C5340}
.bear .msg .bbtn.pri{background:var(--g);border-color:var(--g);color:#fff}
.bear .msg .lnks{margin-top:4px;display:flex;gap:12px}
.bear .x{position:absolute;top:5px;right:6px;width:22px;height:22px;border:none;

  if(!t.crowd) return null;
  const now = new Date(), h = now.getHours(), day = now.getDay();
  const pat = (day === 0 || day === 6) ? (t.crowd.we || t.crowd.wd) : t.crowd.wd;
  if(!pat || pat.length < 24) return null;
  const lv = parseInt(pat.charAt(h), 10);
  if(!lv) return null;
  return { lv:lv, label:['', '人少', '普通', '人多'][lv], src:t.crowd.src || '' };
}

  const c = crowdNow(t);
  if(!c) return '';
  let bars = '';
  for(let i = 1; i <= 3; i++) bars += '<i' + (i <= c.lv ? ' class="on"' : '') + '></i>';
  return '<span class="crowd" title="依過去紀錄推估' + (c.src ? '，來源：' + c.src : '') + '">'
       + '<span class="cmeter">' + bars + '</span>推估人潮 ' + c.label + '</span>';

  if(t.peak) parts.push('<span class="fpeak">' + t.peak + '</span>');
  const cw = crowdHtml(t);
  if(cw) parts.push(cw);

/* ===== 看故事：先讓獅仔講維基的摘要，想看更多再開條目 =====
   用 Wikimedia REST 的 page/summary（條目第一段），Accept-Language 要 zh-TW 才會是台灣正體。
   字是維基的，我們只裁不改，所以泡泡裡標「摘自維基百科」；抓不到就照舊直接開條目。 */
const wikiCache = {};
function wikiSummary(title){
  if(wikiCache[title]) return Promise.resolve(wikiCache[title]);
  const url = 'https://zh.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title);
  return fetch(url, { headers:{ 'Accept-Language':'zh-TW' } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      const txt = j && j.extract ? String(j.extract).trim() : '';
      if(txt) wikiCache[title] = txt;
      return txt || null;
    }).catch(function(){ return null; });
}
/* ===== 獅仔的四段小簡介 =====
   起源／特色：維基第一段裁句，原文不改；適合：主祀神 → temples.js 的需求對照表；
   近期：lunar.js 的神明聖誕算出下一次。每一段都有來源，泡泡底下標出來。
   沒有後端就沒有真的 AI 改寫，所以不叫「AI 總結」——叫獅仔幫你整理，字是維基的。 */
function splitSentences(txt){
  return String(txt).split('。').map(function(x){ return x.trim(); }).filter(Boolean)
    .map(function(x){ return x + '。'; });
}
function clampText(x, n){ return x.length > n ? x.slice(0, n - 1) + '…' : x; }
function briefFromWiki(txt){
  const ss = splitSentences(txt);
  const yr   = /(\d{3,4}\s*年|[康乾嘉道咸同光宣]\S{0,3}年|清[代朝領]|明[代朝鄭]|日治|創建|建於|興建|建立|奠基|落成)/;
  const feat = /(古蹟|建築|雕|藝術|三大|最|著名|聞名|香火|祭|遶境|特色|列為|保存|格局|殿)/;
  const oi = ss.findIndex(function(x){ return yr.test(x); });
  const origin = oi >= 0 ? ss[oi] : (ss[0] || '');
  /* 特色優先挑「起源」之後的句子（第一句多半只是在說它在哪、是什麼古蹟） */
  const after  = ss.slice(oi + 1), before = ss.slice(0, Math.max(oi, 0));
  const feature = after.find(function(x){ return feat.test(x); })
               || before.find(function(x){ return feat.test(x); })
               || after[0] || before[0] || '';
  return { origin: clampText(origin, 72), feature: clampText(feature, 72) };
}
function allNeeds(deity){
  return Object.keys(window.NEEDS || {}).filter(function(k){ return matchNeed(deity, k); });
}
/* 這間廟主祀神的下一個聖誕（含今天）；400 天內找不到就 null */
function nextBirthday(t){
  const hits = (window.GOD_BIRTHDAY || []).filter(function(b){ return (t.deity || '').indexOf(b.key) >= 0; });
  if(!hits.length) return null;
  const d = new Date();
  for(let i = 0; i < 400; i++){
    const l = lunarOf(d);
    if(l && !l.leap){
      const md = l.month + '.' + l.day;
      const b = hits.find(function(x){ return x.md === md; });
      if(b) return { b:b, days:i, mon: LUNAR_MONTH_NAME[l.month] + '月', day: LUNAR_DAY_NAME[l.day],
                     lunar:'農曆' + LUNAR_MONTH_NAME[l.month] + '月' + LUNAR_DAY_NAME[l.day] };
    }
    d.setDate(d.getDate() + 1);
  }
  return null;
}
function briefHtml(t, wikiTxt){

  h += row('適合', (needs.length ? needs : ['平安']).map(function(n){ return '<span class="chip">求' + n + '</span>'; }).join(''));

  /* 主要動作實色、次要空心；沒維基就讓官網當主要 */
  const btns = [];

function tellStory(t){

     closePanel 會順手把輪播接回去，所以要在它之後再把輪播停掉、寫進故事。 */
  closePanel(false);

  p.then(function(txt){
    if(bearFocusT !== t) return;                  /* 使用者已經換別間了 */
    msg.innerHTML = briefHtml(t, txt);

/* ===== YouBike 即時站點 =====
   來源：臺北市交通局 YouBike2.0 即時資料（tcgbusfs blob）、新北市政府資料開放平臺 YouBike2.0。
   兩邊欄位不同，抓下來先轉成同一個形狀：{ name, lat, lng, rent, ret, total, at }。
   這是即時資料（有時間戳），所以獅仔可以講「現在可借幾台」——這是整張地圖上
   唯一一個能講「現在」的數字。只抓被點那間廟所在的城市，60 秒內不重抓。
   抓不到就什麼都不講，不補假的。 */
const YB_SRC = {
  taipei: ['https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json'],
  ntpc:   ['https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json?page=0&size=1000',
           'https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json?page=1&size=1000',
           'https://data.ntpc.gov.tw/api/datasets/010e5b15-3823-4b20-b401-b1cf000550c5/json?page=2&size=1000']
};
const YB_TTL_MS = 60000, YB_NEAR_KM = 0.3;
const ybCache = { taipei:{ at:0, list:null }, ntpc:{ at:0, list:null } };
function ybCity(t){
  const a = String(t.addr || '');
  if(a.indexOf('新北市') === 0) return 'ntpc';
  if(a.indexOf('台北市') === 0 || a.indexOf('臺北市') === 0) return 'taipei';
  return null;
}
function ybNormalize(city, rows){
  const out = [];
  (rows || []).forEach(function(r){
    if(String(r.act) !== '1') return;                       /* 停用的站不算 */
    const lat = parseFloat(city === 'taipei' ? r.latitude : r.lat);
    const lng = parseFloat(city === 'taipei' ? r.longitude : r.lng);
    if(!isFinite(lat) || !isFinite(lng)) return;
    out.push({
      name : String(r.sna || '').replace(/^YouBike2\.0_/, ''),
      lat  : lat, lng : lng,
      rent : +(city === 'taipei' ? r.available_rent_bikes   : r.sbi_quantity) || 0,
      ret  : +(city === 'taipei' ? r.available_return_bikes : r.bemp)         || 0,
      total: +(city === 'taipei' ? r.Quantity : r.tot_quantity) || 0,
      at   : String(r.mday || '')
    });
  });
  return out;
}
function loadYouBike(city){
  const c = ybCache[city];
  if(!c) return Promise.resolve(null);
  if(c.list && Date.now() - c.at < YB_TTL_MS) return Promise.resolve(c.list);
  return Promise.all(YB_SRC[city].map(function(u){
      return fetch(u, { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
    })).then(function(pages){
      const list = ybNormalize(city, [].concat.apply([], pages));
      if(list.length){ c.list = list; c.at = Date.now(); }
      return c.list;
    }).catch(function(){ return c.list; });
}
/* 同步版：只看快取（templeTip 是同步函式）。還沒抓到就回 null，獅仔就先不提 */
function ybNearest(t){
  const city = ybCity(t); if(!city) return null;
  const list = ybCache[city].list; if(!list) return null;
  let best = null;
  for(const s of list){
    const d = haversine(t.lat, t.lng, s.lat, s.lng);
    if(d <= YB_NEAR_KM && (!best || d < best.d)) best = { d:d, s:s };
  }
  return best;
}

/* ===== 面板貼著圖釘 =====
   面板放在被點的那顆圖釘旁邊（預設右邊，右邊放不下就換左邊），
   上下以圖釘為中心，超出地圖範圍就往內夾。地圖一動就重算。 */
let panelTarget = null;
function placePanel(t){
  if(!tpanelEl.classList.contains('on')) return;
  const pt = map.latLngToContainerPoint([t.lat, t.lng]);
  const W  = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  tpanelEl.classList.add('pinned');
  const pw = tpanelEl.offsetWidth, ph = tpanelEl.offsetHeight;
  const GAP = 30, TOP_SAFE = 100;      /* 100 = 上方標題列 + 篩選 chips 的高度 */
  let left = pt.x + GAP;
  if(left + pw > W - 10) left = pt.x - GAP - pw;
  left = Math.max(10, Math.min(W - pw - 10, left));
  let top = pt.y - ph / 2;
  top = Math.max(TOP_SAFE, Math.min(H - ph - 10, top));
  tpanelEl.style.left = left + 'px';
  tpanelEl.style.top  = top  + 'px';
}
function panelFollow(){ if(panelTarget) placePanel(panelTarget); }

function closePanel(restore){
  const wasOpen = tpanelEl.classList.contains('on');
  tpanelEl.classList.remove('on', 'pinned');
  tpanelEl.style.left = tpanelEl.style.top = '';
  if(typeof map !== 'undefined' && map && map.off) map.off('move zoom', panelFollow);
  panelTarget = null;
  if(typeof clearParking === 'function') clearParking();
  tpanelEl.innerHTML = '';
  if(wasOpen) releaseBear();
  if(wasOpen && restore) setSheet(false);
}
function openPanel(i){
  const t = shown[i];
  if(!t) return;
  const a = [];
  a.push('<button class="tact js-story"><svg viewBox="0 0 24 24">'
      + P_ICON.story + '</svg>看故事<span class="sub">' + (t.wiki ? '維基' : '') + '</span></button>');   /* 按鈕寫「要什麼」，小字寫「誰給的」；之後換廟方資料只改小字 */
  if(t.url)
    /* 官網那顆用線稿小廟當 icon，跟同一排的其他圖示同一套（單色 Material 線稿） */
    a.push('<button class="tact" data-go="' + esc(t.url) + '"><svg viewBox="0 0 24 24">'
      + P_ICON.temple + '</svg>' + (t.urlKind === 'fb' ? '官方粉專' : '官方網站') + '</button>');
  a.push('<button class="tact js-nav"><svg viewBox="0 0 24 24">'
    + P_ICON.nav + '</svg>導航過去</button>');
  /* 每一間都給「周遭停車場」：開放資料只有點位跟數量，真的要找還是得看地圖 */
  a.push('<button class="tact" data-go="' + esc(parkMapUrl(t)) + '"><svg viewBox="0 0 24 24">'
      + WALK_ICON.parking + '</svg>周遭停車場<span class="sub">Google</span></button>');
  if(t.tel)
    a.push('<a class="tact" href="tel:' + String(t.tel).replace(/[^0-9+]/g,'') + '"><svg viewBox="0 0 24 24">'
      + P_ICON.tel + '</svg>打電話</a>');
  if(window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker'))
    a.push('<button class="tact js-share"><svg viewBox="0 0 24 24">'
      + P_ICON.share + '</svg>分享給朋友</button>');

  tpanelEl.innerHTML =
    '<div class="tcard head"><button class="tx js-close" aria-label="關閉">×</button>'
    + '<div class="tname">' + esc(t.name) + '</div>'
    + '<div class="tsub"><span class="tag" style="' + tagStyle(t.deity) + '">'
    + esc(t.deity || '—') + '</span><span>' + fmtDist(t.d) + '</span></div></div>'
    + '<div class="tcard acts">' + a.join('')
    + (t.wiki ? '' : '<div class="tnote">這間還沒查到維基百科條目</div>')
    + '</div>';
  tpanelEl.classList.add('on');
  bearFocus(t);          /* 獅仔留在原位，改講「你點的這一間」；輪播先停 */
  /* 地圖只佔上面 42%，塞不下四五顆按鈕。選了一間廟就把清單收起來，
     地圖變大、面板也放得完整；要看清單再拉一下把手就回來。 */
  setSheet(true);
  /* 清單收起來會改變地圖大小，等版面定了再對焦。
     對完焦再往右推半個面板寬，廟才會落在左半邊而不是被面板蓋住。 */
  setTimeout(function(){
    map.invalidateSize();
    map.setView([t.lat, t.lng], Math.max(map.getZoom(), 16), { animate:false });
    map.panBy([ (tpanelEl.offsetWidth + 20) / 2, 0 ], { animate:false });
    placePanel(t);                      /* 面板貼到圖釘旁邊，而不是固定在右上角 */
    showParking(t);                     /* 這間廟附近的停車場一起浮出來 */
    map.on('move zoom', panelFollow);   /* 使用者拖地圖、縮放時面板跟著圖釘走 */
  }, 300);
  panelTarget = t;

  /* YouBike：即時資料，抓到再插一顆鈕、再讓獅仔補一句。面板已經換人就不動 */
  const city = ybCity(t);
  if(city) loadYouBike(city).then(function(){
    if(panelTarget !== t) return;
    const yb = ybNearest(t); if(!yb) return;
    const acts = tpanelEl.querySelector('.tcard.acts'); if(!acts) return;
    const navBtn = acts.querySelector('.js-nav');
    const btn = document.createElement('button');
    btn.className = 'tact js-yb';
    btn.innerHTML = '<svg viewBox="0 0 24 24">' + P_ICON.bike + '</svg>YouBike'
      + '<span class="sub">' + (yb.s.rent > 0 ? '可借 ' + yb.s.rent : '沒車') + '</span>';
    btn.title = yb.s.name + '・' + Math.round(yb.d * 1000) + ' 公尺・可借 ' + yb.s.rent + ' 可還 ' + yb.s.ret;
    (navBtn && navBtn.nextSibling) ? acts.insertBefore(btn, navBtn.nextSibling) : acts.appendChild(btn);
    placePanel(t);          /* 多了一顆鈕，面板高度變了，重新對齊圖釘 */
    if(!bearOff) bearFocus(t);   /* 獅仔補上 YouBike 那句 */
  });

  tpanelEl.onclick = function(e){
    const el = e.target.closest ? e.target : null; if(!el) return;
    if(el.closest('.js-close')){ closePanel(true); return; }
    if(el.closest('.js-nav')){ navigate(t); return; }
    if(el.closest('.js-yb')){ const yb = ybNearest(t); if(yb) navigate(yb.s); return; }
    if(el.closest('.js-share')){ shareTemple(t); return; }
    if(el.closest('.js-story')){ tellStory(t); return; }
    const go = el.closest('[data-go]');
    if(go){ openUrl(go.getAttribute('data-go')); }
  };
}
function esc(x){
  return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shareTemple(t){

const chipBox = document.getElementById('chips');
function buildChips(){
  const all = ['全部', ...Object.keys(window.NEEDS)];
  all.forEach(n=>{
    const b = document.createElement('button');
    b.className = 'chip' + (n === '全部' ? ' on' : '');

      const img = NEED_IMG[n];

    }
    b.onclick = ()=>{
      activeNeed = (n === '全部') ? null : n;
      [...chipBox.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      render();
    };
    chipBox.appendChild(b);
  });
  /* 滑到最右邊就把漸層收起來 */
  const wrap = document.getElementById('chipwrap');
  const sync = ()=>{
    const atEnd = chipBox.scrollLeft + chipBox.clientWidth >= chipBox.scrollWidth - 2;
    wrap.classList.toggle('end', atEnd);
  };
  chipBox.addEventListener('scroll', sync, { passive:true });
  window.addEventListener('resize', sync);
  sync();
}
function matchNeed(deity, need){
  if(!need) return true;
  return (window.NEEDS[need] || []).some(k => (deity||'').includes(k));
}

/* ===== 農曆 =====
   從 lunar.js 的初一對照表回推今天的農曆日期。
   初一、十五是宮廟人潮的主要節奏，這是日曆事實不是猜的。 */
function lunarOf(date){
  const tbl = window.LUNAR_NEW_MONTH || [];
  const iso = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0')
            + '-' + String(date.getDate()).padStart(2,'0');
  let hit = null;
  for(const row of tbl){ if(row[0] <= iso) hit = row; else break; }
  if(!hit) return null;
  const a = new Date(hit[0] + 'T00:00:00'), b = new Date(iso + 'T00:00:00');
  const day = Math.round((b - a) / 86400000) + 1;
  if(day < 1 || day > 30) return null;
  return { month:hit[1], day:day, leap:!!hit[2] };
}
const LUNAR_MONTH_NAME = ['','正','二','三','四','五','六','七','八','九','十','十一','十二'];
const LUNAR_DAY_NAME = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
/* 找出「今天或明天」是哪位神明的聖誕，且該神明在目前清單裡有對應的宮廟 */
function birthdayHit(offsetDays){
  const d = new Date(); d.setDate(d.getDate() + offsetDays);
  const l = lunarOf(d);
  if(!l || l.leap) return null;
  const md = l.month + '.' + l.day;
  for(const b of (window.GOD_BIRTHDAY || [])){
    if(b.md !== md) continue;
    const t = shown.filter(x => (x.deity || '').indexOf(b.key) >= 0);
    if(t.length) return { info:b, temples:t };
  }
  return null;
}

/* ===== 獅仔對「使用者點的這一間」講的話 =====
   跟 bearLines() 的差別：那邊講的是清單第一間（最近的那間），
   這邊講的是使用者剛剛點開的那間。規則由上往下試，缺資料就降一級，
   沒有一句是編的；連「沒有資料」本身都直接講出來。 */
const FEW_LOTS       = 2;     /* 附近停車場少於這個數量就提醒別開車 */
/* 開放資料裡沒有這一帶的停車場時講的話。「內部提供」指廟方填報（目前還沒有），
   「周遭」交給 Google 地圖搜尋，連結由 bearEl 的 click 事件接手。 */
const NO_PARK_LINE = '沒有廟方的停車資訊，周遭停車場我可以推薦，';
const PARK_LINK    = '<a class="lnk js-parkmap" href="#">看周遭停車場 ↗</a>';
const WALKABLE_MAX_M = 1500;  /* 超過這個距離就別再講「走路幾分鐘」 */

function templeTip(t){
  /* 停車場只講「附近有幾個」，不講幾格（見 countFac 的說明）。
     lots = null 代表開放資料沒涵蓋這一區（目前只有臺北市），跟 0 個是兩回事。 */
  const lots  = parkingCovered(t) ? countFac(t, 'parking', PARK_KM) : null;
  /* 沒定位時 t.d 是用 FALLBACK 算的，那不是「離你多遠」，所以一個字都不能講 */
  const dist  = me ? fmtDist(t.d) : null;
  const walk  = me ? Math.max(1, Math.round(t.d * 1000 / WALK_M_PER_MIN)) : null;
  const nm    = '<b>' + esc(t.name) + '</b>';
  /* s 是主句；mrt 是這句想接的「搭車」尾巴（人潮句講過就不重複）；
     walkable 表示走得到，那就不要再勸人搭車。字要少，泡泡只有兩三行。 */
  let s = null, mrt = '', walkable = false;

  if(t.parking === true){            /* 廟方填報有停車場（最準的一層），但沒有即時空位 */
    s = nm + '有停車場，但沒有即時空位資訊，'
      + (lots ? '附近另有 <b>' + lots + '</b> 個公共停車場，' : '');
    mrt = '或搭捷運也行。';
  }
  else if(lots !== null && lots < FEW_LOTS){
    s = '開車來' + nm + '要注意，附近'
      + (lots === 0 ? '沒有公共停車場，' : '只有 <b>' + lots + '</b> 個停車場，');
    mrt = '建議搭捷運。';
  }
  else if(dist && t.d * 1000 <= WALKABLE_MAX_M){
    s = nm + '離你 <b>' + dist + '</b>，走路約 ' + walk + ' 分鐘，不用找車位。';
    walkable = true;
  }
  else if(dist && lots !== null)
    s = nm + '離你 <b>' + dist + '</b>，附近有 <b>' + lots + '</b> 個停車場。';
  else if(dist){ s = nm + '離你 <b>' + dist + '</b>。' + NO_PARK_LINE; mrt = '或搭捷運也行。'; }
  else if(lots !== null)
    s = nm + '附近有 <b>' + lots + '</b> 個停車場。';
  else { s = nm + '主祀' + esc(t.deity || '—') + '。' + NO_PARK_LINE; mrt = '或搭捷運也行。'; }

  /* 人潮句：只接一句，全部都是日曆事實（神明聖誕、初一十五、週末），
     不是統計出來的「過往人潮」——打卡資料接上之前不能那樣講。 */
  const now = new Date();
  const bd  = birthdayHit(0);
  const l   = lunarOf(now);
  const wk  = now.getDay() === 0 || now.getDay() === 6;
  let crowd = null;
  if(bd && bd.temples.some(function(x){ return x.name === t.name; }))
    crowd = '今天是<b>' + bd.info.name + '</b>，人車都多';
  else if(l && (l.day === 1 || l.day === 15))
    crowd = '今天農曆<b>' + LUNAR_DAY_NAME[l.day] + '</b>，香客多';
  else if(wk)
    crowd = '週末香客通常較多';

  if(crowd)      s += crowd + (walkable ? '。' : '，建議搭大眾運輸。');
  else if(mrt)   s += mrt;
  else if((t.fac || []).indexOf('accessible') >= 0)
    s += '有無障礙廁所。';
  /* YouBike：唯一能講「現在」的數字，因為是即時資料。走得到的廟就不提（走路就好）。
     還沒抓到就不講，抓到了但 300 公尺內沒站也不講。 */
  const yb = walkable ? null : ybNearest(t);
  if(yb){
    s += yb.s.rent > 0
       ? 'YouBike ' + esc(yb.s.name) + '站現在可借 <b>' + yb.s.rent + '</b> 台。'
       : 'YouBike ' + esc(yb.s.name) + '站現在沒車可借。';
  }
  return s + ' ' + PARK_LINK;   /* 每一間都給「看周遭停車場」，交給 Google 地圖 */
}

/* ===== 熊爸 =====
   每一句都由「現在真的知道的事」組出來，沒有一句是編的：
     · 使用者選的心願與篩選結果數
     · 最近的宮廟名稱與實際距離
     · 開放資料裡的停車位數
     · 從 temples.js 讀到的廟內設施
     · 系統時間
   之後接上農曆與打卡紀錄，才會有「初一十五人多」「最近很多人求姻緣」那種句子。 */
function bearLines(){
  const out = [];
  const near = shown[0];
  if(near){
    /* 沒拿到定位時 near.d 是用 FALLBACK 算的，講「你附近幾公尺」就是編的，所以改講別的 */
    if(me){
      const m = Math.max(1, Math.round(near.d * 1000 / WALK_M_PER_MIN));
      out.push('你附近 <b>' + fmtDist(near.d) + '</b> 就有<b>' + near.name + '</b>，走路大約 ' + m + ' 分鐘。');
    } else {
      out.push('還沒拿到你的位置，距離先不算。清單上第一間是<b>' + near.name + '</b>。');
    }
    const fac = near.fac || [];
    if(fac.indexOf('accessible') >= 0)
      out.push('<b>' + near.name + '</b>有無障礙廁所，帶長輩或推車來比較方便。');
    if(parkingCovered(near)){            /* 只講幾個停車場，不講幾格 */
      const n = countFac(near, 'parking', PARK_KM);
      if(n < FEW_LOTS)
        out.push('開車來<b>' + near.name + '</b>要注意，附近' + (n ? '只有 ' + n + ' 個' : '沒有公共') + '停車場，建議搭捷運。');
      else
        out.push('<b>' + near.name + '</b>附近有 ' + n + ' 個停車場。');
    }
  }
  if(activeNeed){
    if(shown.length)
      out.push('想<b>求' + activeNeed + '</b>的話，這附近有 <b>' + shown.length + '</b> 間可以拜。');
    else
      out.push('這附近 ' + RADIUS_KM + ' 公里內沒有主祀「' + activeNeed
             + '」的宮廟，把地圖拉遠一點也許找得到。');
  }
  /* 農曆：初一、十五，以及神明聖誕。這幾句是日曆算出來的，不是編的 */
  const l = lunarOf(new Date());
  if(l && (l.day === 1 || l.day === 15))
    out.unshift('今天是農曆<b>' + LUNAR_DAY_NAME[l.day] + '</b>，宮廟通常比平常熱鬧一些。');
  const today = birthdayHit(0), tmr = birthdayHit(1);
  if(today)
    out.unshift('今天是<b>' + today.info.name + '</b>，附近的<b>' + today.temples[0].name + '</b>應該很熱鬧。');
  else if(tmr)
    out.unshift('<b>明天</b>是' + tmr.info.name + '，<b>' + tmr.temples[0].name + '</b>今天就開始準備了。');

  const h = new Date().getHours();
  if(h < 7)       out.push('這麼早就出門，很多宮廟這時候剛開門，人也少。');
  else if(h >= 20) out.push('晚上了，出門前先確認一下宮廟的開放時間。');
  return out;
}
let bearIdx = 0, bearTimer = null, bearOff = false;
/* bearOff = 使用者按 × 關掉的（要按召喚鈕才回來）
   bearHold = 面板打開時暫時讓位的（面板關掉就自己回來） */
let bearHold = false;
function bearTick(){
  if(bearOff || bearHold) return;
  const lines = bearLines();
  const el = document.getElementById('bear'), msg = document.getElementById('bearMsg');
  if(!lines.length){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  msg.innerHTML = lines[bearIdx % lines.length];
  bearIdx++;
}
function bearStart(){
  clearInterval(bearTimer);
  bearTick();
  bearTimer = setInterval(bearTick, 7000);
}
const bearEl = document.getElementById('bear');
const bearCall = document.getElementById('bearCall');
document.getElementById('bearX').onclick = (e)=>{
  e.stopPropagation();
  bearOff = true; clearInterval(bearTimer);
  bearEl.classList.add('hide');
  bearCall.classList.add('on');
};
/* 面板打開時獅仔不退場，改講使用者點的那一間；輪播先停，這句話要停在畫面上。
   bearHold 照樣設起來，關面板時 releaseBear() 會把輪播接回去。
   使用者按 × 關掉的（bearOff）還是尊重他，不硬跳出來。 */
let bearFocusT = null;   /* 獅仔現在講的是哪間廟（泡泡裡的連結要用） */
function bearFocus(t){
  bearFocusT = t;
  clearInterval(bearTimer);
  bearHold = true;
  if(bearOff) return;
  const line = templeTip(t);
  bearCall.classList.remove('on');
  bearEl.classList.remove('hide');
  document.getElementById('bearMsg').innerHTML = line;
}
/* （目前沒有人呼叫；留著給之後版面真的擠不下時用）
   把獅仔收起來換成召喚鈕。這不算使用者主動關掉，
   所以不動 bearOff——關掉面板之後獅仔還會自己回來。 */
function hideBear(){
  bearHold = true;
  if(bearEl.classList.contains('hide')) return;
  bearEl.classList.add('hide');
  bearCall.classList.add('on');
}
/* 面板關掉之後獅仔自己回來——除非使用者本來就按 × 把它關了 */
function releaseBear(){
  if(!bearHold) return;
  bearHold = false;
  if(bearOff) return;
  bearCall.classList.remove('on');
  bearEl.classList.remove('hide');
  bearStart();
}
bearCall.onclick = ()=>{
  bearOff = false; bearHold = false;
  bearCall.classList.remove('on');
  bearEl.classList.remove('hide');
  bearStart();
};

/* 獅仔可以拖著走。用 transform 位移而不是改 left/top，
   這樣不會跟原本 bottom:58% 那個跟著面板連動的定位打架。 */
(function(){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  const clamp = (v, lo, hi)=> Math.max(lo, Math.min(hi, v));
  bearEl.addEventListener('pointerdown', (e)=>{
    moved = false;                       /* 先歸零：不然上一次拖曳的狀態會把關閉鈕吃掉 */
    if(e.target.closest('.x')) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(getComputedStyle(bearEl).getPropertyValue('--dx')) || 0;
    oy = parseFloat(getComputedStyle(bearEl).getPropertyValue('--dy')) || 0;
    bearEl.classList.add('dragging');
    bearEl.setPointerCapture(e.pointerId);
  });
  bearEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    const r = bearEl.getBoundingClientRect();
    /* 留 32px 不讓它整個被拖出畫面 */
    const nx = clamp(ox + dx, -(r.left - (ox)) - r.width + 60, window.innerWidth - (r.left - ox) - 60);
    const ny = clamp(oy + dy, -(r.top - oy) + 8, window.innerHeight - (r.top - oy) - r.height - 8);
    bearEl.style.setProperty('--dx', nx + 'px');
    bearEl.style.setProperty('--dy', ny + 'px');
  });
  const end = (e)=>{
    if(!dragging) return;
    dragging = false;
    bearEl.classList.remove('dragging');
    try { bearEl.releasePointerCapture(e.pointerId); } catch(_){}
  };
  bearEl.addEventListener('pointerup', end);
  bearEl.addEventListener('pointercancel', end);
  /* 拖完不要順便觸發點擊 */
  bearEl.addEventListener('click', (e)=>{ if(moved){ e.preventDefault(); e.stopPropagation(); } }, true);
  /* 泡泡裡「看周遭停車場」的連結 */
  bearEl.addEventListener('click', (e)=>{
    const a = e.target.closest('.js-parkmap, .js-wiki, .js-site'); if(!a) return;
    e.preventDefault();
    if(!bearFocusT) return;
    if(a.classList.contains('js-wiki'))      openUrl(wikiUrl(bearFocusT));
    else if(a.classList.contains('js-site')) { if(bearFocusT.url) openUrl(bearFocusT.url); }
    else openUrl(parkMapUrl(bearFocusT));
  });
})();

/* ===== 定位 ===== */
function locate(){
  if(!navigator.geolocation){ toast('這個瀏覽器不支援定位'); return; }
  toast('定位中…', 0);
  navigator.geolocation.getCurrentPosition(pos=>{
    me = [pos.coords.latitude, pos.coords.longitude];
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(me, {
      icon: L.divIcon({ html:'<div class="me"></div>', className:'', iconSize:[16,16], iconAnchor:[8,8] }),
      zIndexOffset: 900
    }).addTo(map);
    map.setView(me, 15);
    toastEl.style.display = 'none';
    render();
  }, err=>{
    toast('拿不到你的位置（' + err.message + '）。\n已改用預設中心，你可以直接拖動地圖。', 4200);
    render();
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
document.getElementById('locate').onclick = locate;

/* ===== 底部面板收合 =====
   收合時，浮在地圖上的東西（定位鈕、獅仔、右側面板）一起往下移，
   不然它們會停在原本 58% 的高度，卡在地圖中間。 */
const sheet = document.getElementById('sheet'), locBtn = document.getElementById('locate');
function setSheet(down){
  [sheet, locBtn, tpanelEl, bearEl, bearCall].forEach(function(el){
    el.classList.toggle('down', down);
  });
  setTimeout(function(){ map.invalidateSize(); }, 260);
}
document.getElementById('grip').onclick = function(){
  const down = !sheet.classList.contains('down');
  /* 清單跟右側面板是兩種模式：把清單拉回來就等於離開單一宮廟的畫面。
     不收掉的話面板會被清單擠到只剩一半，按鈕看不完。 */
  if(!down) closePanel(false);
  setSheet(down);
};

/* ===== 啟動 ===== */
buildChips();
render();

// LIFF 初始化：在 LINE 裡會成功；用一般瀏覽器直接開也不會壞
if(window.liff && LIFF_ID !== 'YOUR_LIFF_ID'){
  liff.init({ liffId: LIFF_ID }).then(locate).catch(()=>locate());
} else {
  locate();
}
}
</script>
