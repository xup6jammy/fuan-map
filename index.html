<style>/* Leaflet 1.9.4 */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {

	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;

	}

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;

	}

	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);

.leaflet-touch .leaflet-control-layers-toggle {

.leaflet-control-layers .leaflet-control-layers-list,

	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);

	}
.leaflet-control-attribution,

	white-space: nowrap;

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {
	position: absolute;

	}
.leaflet-popup-content-wrapper {

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,

/* div icon */

.leaflet-div-icon {
	background: #fff;

	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	margin-left: -6px;

<style>
:root{
  --bg:#FBF7EE; --ink:#3A2E2A; --muted:#6B6560; --line:#E6DFD0;
  --g:#0C8F3B; --gt:#E7F7EC; --red:#E05A4B; --gold:#F2B93E; --card:#fff;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink)}

#map{position:absolute;inset:0}
.leaflet-container{background:#EDE7D9;font-family:var(--font)}
/* 把 OSM 的冷灰底圖調成暖色，跟宮廟 pin 同一個色調 */
/* 底圖調暖，跟宮廟 pin 同色調。太黃就把 sepia 調小，太冷就調大（0 ~ .35） */
.leaflet-tile-pane{filter:sepia(.10) saturate(.95) brightness(1.02)}

/* ---- 頂部篩選 ---- */
.top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px 8px;
     background:linear-gradient(to bottom,rgba(251,247,238,.97) 70%,rgba(251,247,238,0));
     padding-top:calc(10px + env(safe-area-inset-top))}
.title{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.title svg{width:20px;height:20px}
/* 七個心願改回一行左右滑。右邊留一道漸層淡出，暗示後面還有；
   滑到底時 JS 會把漸層關掉，才不會一直假裝有東西沒看完。 */
.chipwrap{position:relative}
.chipwrap::after{content:"";position:absolute;top:0;bottom:0;right:0;width:34px;
  background:linear-gradient(to right, rgba(251,247,238,0), var(--bg,#FBF7EE) 78%);
  pointer-events:none;opacity:1;transition:opacity .2s}
.chipwrap.end::after{opacity:0}
.chips{display:flex;flex-wrap:nowrap;gap:7px;padding-bottom:2px;
       overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
       scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;
      padding:6px 13px 6px 7px;font-size:13px;font-weight:700;color:var(--muted);
      white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
      font-family:var(--font);transition:background .16s,border-color .16s,color .16s}
.chip.plain{padding:6px 15px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
/* 法器小圖：跟清單縮圖是同一張，使用者按下心願後看到清單也是同一個圖 */
.cimg{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none;
      background:#FAF5E6}
.chip.on .cimg{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

/* ---- 我的位置 ---- */
.me{width:16px;height:16px;border-radius:50%;background:#2563EB;
    border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.18)}

/* ---- 宮廟標記 ---- */
/* 標記就是圖片本身：沒有白圈、沒有尖角，錨點在正中央 */
.pin{width:44px;height:44px;transform:translate(-50%,-50%);
     filter:drop-shadow(0 2px 4px rgba(58,46,42,.34));
     transform-origin:50% 50%;
     animation:drop .42s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes drop{
  0%{transform:translate(-50%,-130%) scale(.55);opacity:0}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pin.act{animation:pop .5s cubic-bezier(.34,1.56,.64,1);z-index:600}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-62%) scale(1.24)}
  100%{transform:translate(-50%,-50%) scale(1.16)}}
.pin.act{transform:translate(-50%,-50%) scale(1.16)}
/* 我的位置：呼吸光暈 */
.me{position:relative}
.me::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(37,99,235,.5);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
/* 圓形頭像標記：底層是類型圖示，上層蓋法器圖，載入失敗會自己移除 */
.pdot{position:relative;width:44px;height:44px;border-radius:11px;overflow:hidden;
      background:#FAF5E6;box-sizing:border-box;display:grid;place-items:center}
.pdot .picon{width:22px;height:22px;display:block}
.pdot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){
  .pin,.pin.act,.me::after{animation:none}}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--card);

.rfac{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:5px}

.fpill{display:inline-flex;align-items:center;justify-content:center;

.fopen.yes{color:#127A3E} .fopen.yes i{background:#17A34A}
.fopen.no{color:#9A938C}  .fopen.no i{background:#C6BFB6}
.fpeak{font-size:10.5px;color:#9A938C}
/* 附近設施用外框，跟「廟內設施」的實心藥丸在視覺上分開，

.npill{font-size:10.5px;font-weight:700;color:#5A6E86;background:transparent;

.npill.ico svg{width:13px;height:13px}

   點下去會說明，這一格本身就是廟方回報功能的入口。 */
.npill.todo{border-color:#CDBFA4;background:#FBF7EC;color:#8A7C5E;cursor:pointer;
            font-family:var(--font)}
.npill.todo:active{background:#F3ECDC}
/* 人潮：用「填滿幾格」表示多寡，不用顏色分級。

.rbtn{background:transparent;border:none;padding:4px;margin:-4px;
      display:grid;place-items:center;cursor:pointer;line-height:0}
/* 導航鈕：白底、暖色邊框與箭頭同色（#A2926C），圓角 15px 跟左邊的宮廟縮圖同弧度。
   邊框與箭頭刻意用同一個顏色，整顆才會讀成「一組」而不是「空圈裡裝了東西」。
   #A2926C 對白底的對比是 3.06:1，剛好跨過圖形元件的 3:1 門檻——
   再淡一階（#BCAF8E 2.17:1）在戶外陽光下就看不見了。 */
.rbtn i{width:36px;height:36px;border-radius:15px;background:#fff;
        border:1.5px solid #A2926C;box-sizing:border-box;
        display:grid;place-items:center;transition:transform .12s,background .12s}

.bear.down,.bearcall.down{bottom:116px}

/* ===== 宮廟面板：浮在地圖右側 =====

/* 依序嘗試多個來源載入 Leaflet；任一成功即繼續，全部失敗才顯示訊息 */
(function(){

    'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
    'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',

  ];
  var i = 0;
  function next(){
    if (i >= SRC.length) return fail();
    var sc = document.createElement('script');
    sc.src = SRC[i++];

    document.head.appendChild(sc);
  }
  function fail(){
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:absolute;inset:0;z-index:2000;background:#FBF7EE;padding:40px 28px;'
    + 'font-family:sans-serif;color:#3A2E2A">'
    + '<div style="font-size:17px;font-weight:800;margin-bottom:12px">地圖元件載入失敗</div>'
    + '<div style="font-size:14px;line-height:1.9;color:#6B6560">'
    + '網路可能擋住了外部資源。請把 <b>leaflet.js</b> 下載後放到與 index.html 同一層，再重新整理。'
    + '</div></div>');

  window.addEventListener('DOMContentLoaded', function(){

function boot(){

const LIFF_ID = "2011335067-mhkycNOg";   // ← 到 LINE Developers 建好 LIFF 後填這裡
const RADIUS_KM = 5;              // 搜尋半徑
const MAX_PINS  = 60;             // 同時顯示的標記上限（資料量大時保護效能）
const FALLBACK  = [25.0478, 121.5170];  // 拿不到定位時的預設中心（台北車站）

/* ===== 地圖 ===== */
const map = L.map('map', { zoomControl:false, attributionControl:true })
             .setView(FALLBACK, 14);
/* 圖磚來源：OpenStreetMap 官方，免金鑰。
   （原本的 CartoCDN Voyager 現在需要 API key，沒帶金鑰整片會蓋上

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,

function haversine(a, b, c, d){
  const R = 6371, r = Math.PI/180;
  const dLat = (c-a)*r, dLng = (d-b)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(x));
}

  // 蓮花：註生娘娘的象徵，三瓣

/* 找不到對應需求時的預設圖示：一間廟的剪影（屋簷＋廟身＋門洞＋台基） */
const DEFAULT_D = '<path d="M12 3.4 20.6 7.6c.5.3.3 1.1-.3 1.1H3.7c-.6 0-.8-.8-.3-1.1z"/>'
  + '<path d="M5.2 10.2h13.6v8.4h-4.2v-3.4a2.6 2.6 0 0 0-5.2 0v3.4H5.2z"/>'

function needOf(deity){
  /* 正在篩選某一類時，優先顯示「使用者正在找的那一類」的圖示。
     例：土地公同時屬於「事業財運」和「地方守護」，
     按了「求地方守護」就該看到盾牌，而不是銅錢。 */
  if(activeNeed && matchNeed(deity, activeNeed)) return activeNeed;
  for(const k of ["姻緣","求子","學業考試","事業財運","平安健康","地方守護"]){
    if((window.NEEDS[k]||[]).some(w => (deity||"").includes(w))) return k;
  }
  return null;
}
/* 六種需求各一張法器圖。圖是綁在「需求」上而不是「宮廟」上，
   所以資料從 15 間變成幾千間也不用再加任何一張。
   needOf() 會跟著篩選走，按「求地方守護」時土地公廟的圖示
   會自動從元寶換成令旗。 */
const NEED_IMG = {

  "學業考試":"study.webp",

   之後若某間廟在 temples.js 補上 img 欄位，照片會蓋在這張圖上面；
   照片載入失敗會自己移除，露出底下這張類型圖，不會開天窗。 */
function typeIcon(deity){

  return '<svg class="ticon" viewBox="0 0 24 24" fill="' + (b ? b.c : DEFAULT_C) + '">'
       + (b ? b.d : DEFAULT_D) + '</svg>';

function thumbBg(deity){

}
function pinFor(deity){

    + '<div class="pdot">'
    +   '<svg class="picon" viewBox="0 0 24 24" fill="' + c + '">' + (b ? b.d : DEFAULT_D) + '</svg>'
    +   (img ? '<img src="' + img + '" alt="" onerror="this.remove()">' : '')
    + '</div></div>';

/* ===== 設施與開放時間 =====
   資料模型刻意用「只列確定有的」而不是 true/false，
   因為「沒調查過」和「確定沒有」是兩件事，不能混為一談。
   沒列出來只代表還不知道，畫面上就不會宣稱這間廟沒有廁所。 */
const FAC_LABEL = { toilet:"廁所", water:"飲水", parking:"停車", accessible:"無障礙", nursery:"親子廁所" };

/* open 支援 "06:00-21:00"、"24h"、跨午夜的 "22:00-02:00" */
function openState(open){
  if(!open) return null;
  if(open === '24h') return { on:true, text:'24 小時開放' };
  const m = String(open).match(/(\d{1,2}):(\d{2})\s*[-–~]\s*(\d{1,2}):(\d{2})/);
  if(!m) return { on:null, text:open };
  const now = new Date(), cur = now.getHours()*60 + now.getMinutes();
  const a = (+m[1])*60 + (+m[2]), b = (+m[3])*60 + (+m[4]);
  const on = (a <= b) ? (cur >= a && cur < b) : (cur >= a || cur < b);
  return { on:on, text:open.replace(/\s*-\s*/,'–') };
}

/* 從 facilities.js 找出離這間廟最近的某類設施。
   maxKm 之外就不顯示——與其給一個 800 公尺外的廁所，不如什麼都不說。 */
/* 80 公尺/分 ≈ 時速 4.8 公里，是都市步行的常見估算值，不是實測 */
const WALK_M_PER_MIN = 80;
function nearestFac(t, type, maxKm){
  const list = window.FACILITIES || [];
  let best = null;
  for(const f of list){
    if(f.type !== type) continue;
    const d = haversine(t.lat, t.lng, f.lat, f.lng);
    if(d <= maxKm && (!best || d < best.d)) best = { d:d, f:f };
  }
  return best;
}
/* 設施圖示（透過 Iconify 的 JSON API 取得原始路徑，未經修改）
     廁所 wc・無障礙 accessible・親子廁所 baby_changing_station・停車 local_parking
       → Google Material Symbols，Apache License 2.0
     飲水機 → Iconify line-md（MIT License），取靜止狀態 */
function iconSvg(k, cls){
  return '<svg viewBox="0 0 24 24"'
       + (cls ? ' class="' + cls + '"' : '') + '>' + WALK_ICON[k] + '</svg>';
}

  accessible: '<path fill="currentColor" d="M10.588 5.413Q10 4.825 10 4t.588-1.412T12 2t1.413.588T14 4t-.587 1.413T12 6t-1.412-.587M17 22v-5h-5q-.825 0-1.412-.587T10 15V9q0-.825.588-1.412T12 7q.6 0 1.038.263t.937.837q1.375 1.65 2.488 2.263T19 11v2q-1.325 0-2.675-.575T14 11.05v3.45h3q.825 0 1.413.588T19 16.5V22zm-7 0q-2.075 0-3.537-1.463T5 17q0-1.8 1.138-3.175T9 12.1v2.05q-.875.35-1.437 1.113T7 17q0 1.25.875 2.125T10 20q.975 0 1.738-.562T12.85 18h2.05q-.35 1.725-1.725 2.863T10 22"/>',
  nursery: '<path fill="currentColor" d="M3 22V12l1.575-4.625q.2-.65.75-1.012T6.5 6q.2 0 .4.038t.4.137L11.45 8H14v2h-3L8.3 8.825L7 12.75V22zm6-3v-2h12v2zm10.5-3q-.625 0-1.062-.437T18 14.5t.438-1.062T19.5 13t1.063.438T21 14.5t-.437 1.063T19.5 16M13 16q-.825 0-1.412-.587T11 14v-1H9v-2h3q.425 0 .713.288T13 12v1h2v-2h2v3q0 .825-.587 1.413T15 16zM8 5q-.825 0-1.412-.587T6 3t.588-1.412T8 1t1.413.588T10 3t-.587 1.413T8 5"/>',
  /* 飲水機：Iconify line-md 的水杯（MIT）。原圖是會倒水的動畫版，
     這裡取動畫結束後的靜止狀態——旁邊三顆都是靜態，只有這顆在動會很吵，

  water: '<path fill="currentColor" d="M0 0h24v24H0z" mask="url(#facWaterMask)"/>'

};

function nearHtml(t){
  const out = [];
  /* 廟裡自己就有的，就不再顯示附近的——同一個圖示在一列出現兩次
     會讓人以為是重複，而且「廟裡有廁所」的時候，三百公尺外那間也不重要了 */
  const own = t.fac || [];
  /* 廁所和飲水機只要知道「有沒有」，所以只給圖示；
     停車位的數量會影響要不要開車過去，所以要寫出來 */
  [['toilet','附近有公廁',0.35], ['water','附近有飲水台',0.35]].forEach(function(cfg){
    if(own.indexOf(cfg[0]) >= 0) return;
    const hit = nearestFac(t, cfg[0], cfg[2]);
    if(!hit) return;
    out.push('<span class="npill ico" title="' + cfg[1] + '：' + hit.f.name + '" aria-label="' + cfg[1] + '">'
      + iconSvg(cfg[0]) + '</span>');
  });
  const pk = nearestFac(t, 'parking', 0.5);
  if(pk){
    const free = pk.f.free;
    let txt = '停車場', cls = '';
    if(typeof free === 'number'){          /* 有即時資料時顯示剩餘 */
      if(free > 0) txt = '剩 <b>' + free + '</b> 位';
      else { txt = '<b>已滿</b>'; cls = ' full'; }
    } else if(typeof pk.f.total === 'number' && pk.f.total > 0){
      txt = '<b>' + pk.f.total + '</b> 格';   /* 只有總車位數 */
    }
    out.push('<span class="npill' + cls + '" title="附近停車場：' + pk.f.name + '">'
      + iconSvg('parking') + txt + '</span>');
  }
  return out;
}

/* 依過去紀錄推估目前人潮。
   crowd.wd / crowd.we 各是 24 個字元，第 h 個字元代表該小時的相對人潮，
   0=沒資料或極少、1=人少、2=普通、3=人多。
   這是「推估」不是即時，所以畫面上一定要寫「推估」兩個字。 */
function crowdNow(t){
  if(!t.crowd) return null;
  const now = new Date(), h = now.getHours(), day = now.getDay();
  const pat = (day === 0 || day === 6) ? (t.crowd.we || t.crowd.wd) : t.crowd.wd;
  if(!pat || pat.length < 24) return null;
  const lv = parseInt(pat.charAt(h), 10);
  if(!lv) return null;
  return { lv:lv, label:['', '人少', '普通', '人多'][lv], src:t.crowd.src || '' };
}
function crowdHtml(t){
  const c = crowdNow(t);
  if(!c) return '';
  let bars = '';
  for(let i = 1; i <= 3; i++) bars += '<i' + (i <= c.lv ? ' class="on"' : '') + '></i>';
  return '<span class="crowd" title="依過去紀錄推估' + (c.src ? '，來源：' + c.src : '') + '">'
       + '<span class="cmeter">' + bars + '</span>推估人潮 ' + c.label + '</span>';
}

function facHtml(t){
  const parts = [];
  const st = openState(t.open);
  if(st){
    if(st.on === null) parts.push('<span class="fpeak">' + st.text + '</span>');
    else parts.push('<span class="fopen ' + (st.on ? 'yes' : 'no') + '"><i></i>'
                  + (st.on ? '開放中' : '已休息') + '　' + st.text + '</span>');
  }
  (t.fac || []).forEach(function(k){
    if(!FAC_LABEL[k] || !WALK_ICON[k]) return;
    parts.push('<span class="fpill" title="廟內設施：' + FAC_LABEL[k] + '" aria-label="廟內有'
      + FAC_LABEL[k] + '">' + iconSvg(k) + '</span>');
  });
  /* 飲水機目前沒有任何開放資料來源，一律顯示成「待廟方確認」。
     這一格空著本身就在說明產品的下一步：廟方登入後自己補。 */
  if((t.fac || []).indexOf('water') < 0){
    parts.push('<button class="npill ico todo js-todo" title="飲水機：還沒有資料，之後開放廟方回報"'
      + ' aria-label="飲水機資料待補">'
      + iconSvg('water') + '</button>');
  }
  if(t.peak) parts.push('<span class="fpeak">' + t.peak + '</span>');
  const near = nearHtml(t);
  const cw = crowdHtml(t);
  const all = parts.concat(near, cw ? [cw] : []);
  return all.length ? '<div class="rfac">' + all.join('') + '</div>' : '';
}

/* ===== 宮廟面板（地圖右側） =====

  share: '<path fill="currentColor" d="M18 16.1c-.8 0-1.5.3-2 .8l-7.1-4.1c.1-.3.1-.5.1-.8s0-.5-.1-.8l7-4.1c.5.5 1.3.8 2.1.8a3 3 0 1 0-3-3c0 .3 0 .5.1.8L8 9.8a3 3 0 1 0 0 4.4l7.1 4.2c-.1.2-.1.5-.1.7a2.9 2.9 0 1 0 3-3"/>',
  nav:   '<path fill="currentColor" d="M20.6 3.4 3.6 10.1c-.8.3-.8 1.4 0 1.7l6.3 2.3 2.3 6.3c.3.8 1.4.8 1.7 0l6.7-17c.3-.7-.4-1.4-1.1-1.1z"/>'
};
const tpanelEl = document.getElementById('tpanel');
/* 在 LINE 裡用 liff.openWindow 開外部瀏覽器，一般瀏覽器就開新分頁 */
function openUrl(url){
  if(window.liff && liff.isInClient && liff.isInClient()) liff.openWindow({ url:url, external:true });
  else window.open(url, '_blank', 'noopener');
}
function wikiUrl(t){ return 'https://zh.wikipedia.org/wiki/' + encodeURIComponent(t.wiki); }

function closePanel(restore){
  const wasOpen = tpanelEl.classList.contains('on');
  tpanelEl.classList.remove('on');
  tpanelEl.innerHTML = '';
  if(wasOpen) releaseBear();
  if(wasOpen && restore) setSheet(false);
}
function openPanel(i){
  const t = shown[i];
  if(!t) return;
  const a = [];
  if(t.wiki)
    a.push('<button class="tact" data-go="' + esc(wikiUrl(t)) + '"><svg viewBox="0 0 24 24">'
      + P_ICON.story + '</svg>看故事<span class="sub">維基</span></button>');
  if(t.url)
    a.push('<button class="tact" data-go="' + esc(t.url) + '"><svg viewBox="0 0 24 24">'
      + P_ICON.web + '</svg>' + (t.urlKind === 'fb' ? '官方粉專' : '官方網站') + '</button>');
  a.push('<button class="tact js-nav"><svg viewBox="0 0 24 24">'
    + P_ICON.nav + '</svg>導航過去</button>');
  if(t.tel)
    a.push('<a class="tact" href="tel:' + String(t.tel).replace(/[^0-9+]/g,'') + '"><svg viewBox="0 0 24 24">'
      + P_ICON.tel + '</svg>打電話</a>');
  if(window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker'))
    a.push('<button class="tact js-share"><svg viewBox="0 0 24 24">'
      + P_ICON.share + '</svg>分享給朋友</button>');

  tpanelEl.innerHTML =
    '<div class="tcard head"><button class="tx js-close" aria-label="關閉">×</button>'
    + '<div class="tname">' + esc(t.name) + '</div>'
    + '<div class="tsub"><span class="tag" style="' + tagStyle(t.deity) + '">'
    + esc(t.deity || '—') + '</span><span>' + fmtDist(t.d) + '</span></div></div>'
    + '<div class="tcard acts">' + a.join('')
    + (t.wiki ? '' : '<div class="tnote">這間還沒查到維基百科條目</div>')
    + '</div>';
  tpanelEl.classList.add('on');
  hideBear();            /* 面板打開時獅仔先退場，不然右邊會擠成一團 */
  /* 地圖只佔上面 42%，塞不下四五顆按鈕。選了一間廟就把清單收起來，
     地圖變大、面板也放得完整；要看清單再拉一下把手就回來。 */
  setSheet(true);
  /* 清單收起來會改變地圖大小，等版面定了再對焦。
     對完焦再往右推半個面板寬，廟才會落在左半邊而不是被面板蓋住。 */
  setTimeout(function(){
    map.invalidateSize();
    map.setView([t.lat, t.lng], Math.max(map.getZoom(), 16), { animate:false });
    map.panBy([ (tpanelEl.offsetWidth + 20) / 2, 0 ], { animate:false });
  }, 300);

  tpanelEl.onclick = function(e){
    const el = e.target.closest ? e.target : null; if(!el) return;
    if(el.closest('.js-close')){ closePanel(true); return; }
    if(el.closest('.js-nav')){ navigate(t); return; }
    if(el.closest('.js-share')){ shareTemple(t); return; }
    const go = el.closest('[data-go]');
    if(go){ openUrl(go.getAttribute('data-go')); }
  };
}
function esc(x){
  return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shareTemple(t){
  const url = 'https://liff.line.me/' + LIFF_ID;
  liff.shareTargetPicker([{ type:'text',
    text:'我在「周遭宮廟地圖」找到' + t.name + '（' + (t.deity || '') + '）\n' + url }])
    .catch(function(){ toast('分享取消了'); });
}

let me = null, meMarker = null, activeNeed = null, markers = [], shown = [], selected = -1;

const chipBox = document.getElementById('chips');
function buildChips(){
  const all = ['全部', ...Object.keys(window.NEEDS)];
  all.forEach(n=>{
    const b = document.createElement('button');
    b.className = 'chip' + (n === '全部' ? ' on' : '');
    if(n === '全部'){ b.classList.add('plain'); b.textContent = '全部'; }
    else {
      const img = NEED_IMG[n];
      b.innerHTML = (img ? '<img class="cimg" src="' + img + '" alt="">' : '') + n;
    }
    b.onclick = ()=>{
      activeNeed = (n === '全部') ? null : n;
      [...chipBox.children].forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      render();
    };
    chipBox.appendChild(b);
  });
  /* 滑到最右邊就把漸層收起來 */
  const wrap = document.getElementById('chipwrap');
  const sync = ()=>{
    const atEnd = chipBox.scrollLeft + chipBox.clientWidth >= chipBox.scrollWidth - 2;
    wrap.classList.toggle('end', atEnd);
  };
  chipBox.addEventListener('scroll', sync, { passive:true });
  window.addEventListener('resize', sync);
  sync();
}
function matchNeed(deity, need){
  if(!need) return true;
  return (window.NEEDS[need] || []).some(k => (deity||'').includes(k));
}

/* ===== 繪製 ===== */
function render(){
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  /* 清單重排之後 index 就不是原來那間廟了，面板先關掉比指錯廟好 */
  selected = -1; closePanel();
  const origin = me || FALLBACK;

  shown = window.TEMPLES
    .map(t => Object.assign({}, t, { d: haversine(origin[0], origin[1], t.lat, t.lng) }))
    .filter(t => matchNeed(t.deity, activeNeed))
    .filter(t => !me || t.d <= RADIUS_KM)
    .sort((a,b) => a.d - b.d)
    .slice(0, MAX_PINS);

  shown.forEach((t, i)=>{
    const icon = L.divIcon({ html: pinFor(t.deity), className:'', iconSize:[44,44], iconAnchor:[22,22] });
    const m = L.marker([t.lat, t.lng], { icon }).addTo(map);
    const el = m.getElement() && m.getElement().querySelector('.pin');
    if(el) el.style.animationDelay = Math.min(i*45, 700) + 'ms';
    m.on('click', ()=>{ select(i); });
    markers.push(m);
  });

  if(typeof bearStart === 'function'){ bearIdx = 0; bearStart(); }
  document.getElementById('sTitle').textContent =
    activeNeed ? ('求' + activeNeed + '｜附近的宮廟') : '附近的宮廟';
  document.getElementById('sMeta').textContent =
    me ? (shown.length + ' 間・' + RADIUS_KM + ' 公里內') : (shown.length + ' 間');

  const list = document.getElementById('list');
  list.innerHTML = '';
  if(!shown.length){
    list.innerHTML = '<div class="empty">'
      + '<svg class="emptyart" viewBox="0 0 120 92">'
      + '<ellipse cx="60" cy="84" rx="34" ry="5" fill="#EFE9DA"/>'
      + '<circle cx="60" cy="14" r="4" fill="#F2B93E"/>'
      + '<path d="M60 19c11 5 21 10 28 13 7 3 13 3 17-1-2 7-8 11-14 14H29c-6-3-12-7-14-14 4 4 10 4 17 1 7-3 17-8 28-13z" fill="#E05A4B"/>'
      + '<rect x="26" y="47" width="68" height="32" rx="3" fill="#F7EAD3"/>'
      + '<rect x="31" y="47" width="6" height="32" fill="#E0785F"/>'
      + '<rect x="83" y="47" width="6" height="32" fill="#E0785F"/>'
      + '<path d="M48 79V64a12 12 0 0 1 24 0v15z" fill="#C23B2E"/>'
      + '<circle cx="60" cy="68" r="2.4" fill="#F2B93E"/>'
      + '<path d="M18 30q6-5 12 0M90 30q6-5 12 0" stroke="#DDD6C6" stroke-width="2.4" fill="none" stroke-linecap="round"/>'
      + '</svg>'
      + '<b>這附近沒有符合的宮廟</b>'
      + '<span>換一個上面的條件試試，<br>或把地圖拉遠一點。</span></div>';
    return;
  }
  shown.forEach((t, i)=>{
    const row = document.createElement('div');
    row.className = 'row' + (i === selected ? ' sel' : '');
    row.innerHTML =
      '<div class="rthumb" style="background:' + thumbBg(t.deity) + '">' +
        typeIcon(t.deity) +
        (needImg(t.deity) ? '<img src="' + needImg(t.deity) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        (t.img ? '<img src="' + t.img + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
        '<span class="rnum">' + (i+1) + '</span></div>' +
      '<div class="rmain"><div class="rname">' + t.name + '</div>' +
      '<div class="rsub"><span class="tag" style="'+tagStyle(t.deity)+'">' + (t.deity || '—') + '</span>' + (t.dist || '') + '</div>' +
      facHtml(t) + '</div>' +
      '<div class="rgo"><div class="rdist">' + fmtDist(t.d) + '</div>' +
      '<button class="rbtn" aria-label="導航到' + t.name + '"><i>'
      + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 3.4 3.6 10.1c-.8.3-.8 1.4 0 1.7'
      + 'l6.3 2.3 2.3 6.3c.3.8 1.4.8 1.7 0l6.7-17c.3-.7-.4-1.4-1.1-1.1z"/></svg></i></button></div>';
    const item = document.createElement('div');
    item.className = 'item';
    item.appendChild(row);

    item.onclick = (e)=>{
      const el = e.target.closest ? e.target : null;
      if(el && el.closest('.js-todo')){
        toast('飲水機還沒有開放資料，之後由廟方自己回報'); return;
      }
      if(el && el.closest('.rbtn')){ navigate(t); return; }
      /* 點列本身：選取，面板開在地圖右邊（鏡頭由 openPanel 統一處理） */
      select(i);
    };
    list.appendChild(item);
  });
}
function tagStyle(deity){
  const n = needOf(deity);
  if(!n) return '';
  const c = BADGE[n].c;
  return 'background:'+c+'1F;color:'+c;
}
function select(i){
  selected = i;
  markers.forEach((m, k)=>{
    const el = m.getElement() && m.getElement().querySelector('.pin');
    if(!el) return;
    if(k === selected){ el.classList.remove('act'); void el.offsetWidth; el.classList.add('act'); }
    else el.classList.remove('act');
  });
  const rows = document.querySelectorAll('.row');
  rows.forEach((r,k)=>r.classList.toggle('sel', k === i));
  if(rows[i]) rows[i].scrollIntoView({ block:'nearest', behavior:'smooth' });
  openPanel(i);
}
function navigate(t){
  const url = 'https://www.google.com/maps/dir/?api=1&destination=' + t.lat + ',' + t.lng;
  if(window.liff && liff.isInClient && liff.isInClient()){
    liff.openWindow({ url: url, external: true });
  } else {
    window.open(url, '_blank');
  }
}

/* ===== 農曆 =====
   從 lunar.js 的初一對照表回推今天的農曆日期。
   初一、十五是宮廟人潮的主要節奏，這是日曆事實不是猜的。 */
function lunarOf(date){
  const tbl = window.LUNAR_NEW_MONTH || [];
  const iso = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0')
            + '-' + String(date.getDate()).padStart(2,'0');
  let hit = null;
  for(const row of tbl){ if(row[0] <= iso) hit = row; else break; }
  if(!hit) return null;
  const a = new Date(hit[0] + 'T00:00:00'), b = new Date(iso + 'T00:00:00');
  const day = Math.round((b - a) / 86400000) + 1;
  if(day < 1 || day > 30) return null;
  return { month:hit[1], day:day, leap:!!hit[2] };
}
const LUNAR_DAY_NAME = ['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
/* 找出「今天或明天」是哪位神明的聖誕，且該神明在目前清單裡有對應的宮廟 */
function birthdayHit(offsetDays){
  const d = new Date(); d.setDate(d.getDate() + offsetDays);
  const l = lunarOf(d);
  if(!l || l.leap) return null;
  const md = l.month + '.' + l.day;
  for(const b of (window.GOD_BIRTHDAY || [])){
    if(b.md !== md) continue;
    const t = shown.filter(x => (x.deity || '').indexOf(b.key) >= 0);
    if(t.length) return { info:b, temples:t };
  }
  return null;
}

/* ===== 熊爸 =====
   每一句都由「現在真的知道的事」組出來，沒有一句是編的：
     · 使用者選的心願與篩選結果數
     · 最近的宮廟名稱與實際距離
     · 開放資料裡的停車位數
     · 從 temples.js 讀到的廟內設施
     · 系統時間
   之後接上農曆與打卡紀錄，才會有「初一十五人多」「最近很多人求姻緣」那種句子。 */
function bearLines(){
  const out = [];
  const near = shown[0];
  if(near){
    const m = Math.max(1, Math.round(near.d * 1000 / 80));
    out.push('你附近 <b>' + fmtDist(near.d) + '</b> 就有<b>' + near.name + '</b>，走路大約 ' + m + ' 分鐘。');
    const fac = near.fac || [];
    if(fac.indexOf('accessible') >= 0)
      out.push('<b>' + near.name + '</b>有無障礙廁所，帶長輩或推車來比較方便。');
    const pk = nearestFac(near, 'parking', 0.5);
    if(pk && typeof pk.f.total === 'number'){
      if(pk.f.total < 20)
        out.push('開車來<b>' + near.name + '</b>要注意，最近的停車場只有 ' + pk.f.total + ' 格，建議搭捷運。');
      else
        out.push('<b>' + near.name + '</b>附近有停車場，' + pk.f.total + ' 格，開車來還算方便。');
    }
  }
  if(activeNeed){
    if(shown.length)
      out.push('想<b>求' + activeNeed + '</b>的話，這附近有 <b>' + shown.length + '</b> 間可以拜。');
    else
      out.push('這附近 ' + RADIUS_KM + ' 公里內沒有主祀「' + activeNeed
             + '」的宮廟，把地圖拉遠一點也許找得到。');
  }
  /* 農曆：初一、十五，以及神明聖誕。這幾句是日曆算出來的，不是編的 */
  const l = lunarOf(new Date());
  if(l && (l.day === 1 || l.day === 15))
    out.unshift('今天是農曆<b>' + LUNAR_DAY_NAME[l.day] + '</b>，宮廟通常比平常熱鬧一些。');
  const today = birthdayHit(0), tmr = birthdayHit(1);
  if(today)
    out.unshift('今天是<b>' + today.info.name + '</b>，附近的<b>' + today.temples[0].name + '</b>應該很熱鬧。');
  else if(tmr)
    out.unshift('<b>明天</b>是' + tmr.info.name + '，<b>' + tmr.temples[0].name + '</b>今天就開始準備了。');

  const h = new Date().getHours();
  if(h < 7)       out.push('這麼早就出門，很多宮廟這時候剛開門，人也少。');
  else if(h >= 20) out.push('晚上了，出門前先確認一下宮廟的開放時間。');
  return out;
}
let bearIdx = 0, bearTimer = null, bearOff = false;
/* bearOff = 使用者按 × 關掉的（要按召喚鈕才回來）
   bearHold = 面板打開時暫時讓位的（面板關掉就自己回來） */
let bearHold = false;
function bearTick(){
  if(bearOff || bearHold) return;
  const lines = bearLines();
  const el = document.getElementById('bear'), msg = document.getElementById('bearMsg');
  if(!lines.length){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  msg.innerHTML = lines[bearIdx % lines.length];
  bearIdx++;
}
function bearStart(){
  clearInterval(bearTimer);
  bearTick();
  bearTimer = setInterval(bearTick, 7000);
}
const bearEl = document.getElementById('bear');
const bearCall = document.getElementById('bearCall');
document.getElementById('bearX').onclick = (e)=>{
  e.stopPropagation();
  bearOff = true; clearInterval(bearTimer);
  bearEl.classList.add('hide');
  bearCall.classList.add('on');
};
/* 面板打開時把獅仔收起來換成召喚鈕。這不算使用者主動關掉，
   所以不動 bearOff——關掉面板之後獅仔還會自己回來。 */
function hideBear(){
  bearHold = true;
  if(bearEl.classList.contains('hide')) return;
  bearEl.classList.add('hide');
  bearCall.classList.add('on');
}
/* 面板關掉之後獅仔自己回來——除非使用者本來就按 × 把它關了 */
function releaseBear(){
  if(!bearHold) return;
  bearHold = false;
  if(bearOff) return;
  bearCall.classList.remove('on');
  bearEl.classList.remove('hide');
  bearStart();
}
bearCall.onclick = ()=>{
  bearOff = false; bearHold = false;
  bearCall.classList.remove('on');
  bearEl.classList.remove('hide');
  bearStart();
};

/* 獅仔可以拖著走。用 transform 位移而不是改 left/top，
   這樣不會跟原本 bottom:58% 那個跟著面板連動的定位打架。 */
(function(){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  const clamp = (v, lo, hi)=> Math.max(lo, Math.min(hi, v));
  bearEl.addEventListener('pointerdown', (e)=>{
    moved = false;                       /* 先歸零：不然上一次拖曳的狀態會把關閉鈕吃掉 */
    if(e.target.closest('.x')) return;
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(getComputedStyle(bearEl).getPropertyValue('--dx')) || 0;
    oy = parseFloat(getComputedStyle(bearEl).getPropertyValue('--dy')) || 0;
    bearEl.classList.add('dragging');
    bearEl.setPointerCapture(e.pointerId);
  });
  bearEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    const r = bearEl.getBoundingClientRect();
    /* 留 32px 不讓它整個被拖出畫面 */
    const nx = clamp(ox + dx, -(r.left - (ox)) - r.width + 60, window.innerWidth - (r.left - ox) - 60);
    const ny = clamp(oy + dy, -(r.top - oy) + 8, window.innerHeight - (r.top - oy) - r.height - 8);
    bearEl.style.setProperty('--dx', nx + 'px');
    bearEl.style.setProperty('--dy', ny + 'px');
  });
  const end = (e)=>{
    if(!dragging) return;
    dragging = false;
    bearEl.classList.remove('dragging');
    try { bearEl.releasePointerCapture(e.pointerId); } catch(_){}
  };
  bearEl.addEventListener('pointerup', end);
  bearEl.addEventListener('pointercancel', end);
  /* 拖完不要順便觸發點擊 */
  bearEl.addEventListener('click', (e)=>{ if(moved){ e.preventDefault(); e.stopPropagation(); } }, true);
})();

/* ===== 定位 ===== */
function locate(){
  if(!navigator.geolocation){ toast('這個瀏覽器不支援定位'); return; }
  toast('定位中…', 0);
  navigator.geolocation.getCurrentPosition(pos=>{
    me = [pos.coords.latitude, pos.coords.longitude];
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(me, {
      icon: L.divIcon({ html:'<div class="me"></div>', className:'', iconSize:[16,16], iconAnchor:[8,8] }),
      zIndexOffset: 900
    }).addTo(map);
    map.setView(me, 15);
    toastEl.style.display = 'none';
    render();
  }, err=>{
    toast('拿不到你的位置（' + err.message + '）。\n已改用預設中心，你可以直接拖動地圖。', 4200);
    render();
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
document.getElementById('locate').onclick = locate;

/* ===== 底部面板收合 =====
   收合時，浮在地圖上的東西（定位鈕、獅仔、右側面板）一起往下移，
   不然它們會停在原本 58% 的高度，卡在地圖中間。 */
const sheet = document.getElementById('sheet'), locBtn = document.getElementById('locate');
function setSheet(down){
  [sheet, locBtn, tpanelEl, bearEl, bearCall].forEach(function(el){
    el.classList.toggle('down', down);
  });
  setTimeout(function(){ map.invalidateSize(); }, 260);
}
document.getElementById('grip').onclick = function(){
  const down = !sheet.classList.contains('down');
  /* 清單跟右側面板是兩種模式：把清單拉回來就等於離開單一宮廟的畫面。
     不收掉的話面板會被清單擠到只剩一半，按鈕看不完。 */
  if(!down) closePanel(false);
  setSheet(down);
};

/* ===== 啟動 ===== */
buildChips();
render();

// LIFF 初始化：在 LINE 裡會成功；用一般瀏覽器直接開也不會壞
if(window.liff && LIFF_ID !== 'YOUR_LIFF_ID'){
  liff.init({ liffId: LIFF_ID }).then(locate).catch(()=>locate());
} else {
  locate();
}
}
</script>
